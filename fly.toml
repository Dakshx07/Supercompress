# Fly.io — production API (keys + /v1/compress)
# Deploy: fly deploy
# Volume: fly volumes create sc_data --size 1 --region sjc -a supercompress-api

app = 'supercompress-api'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  SC_KEY_STORE = 'file'
  SC_KEY_STORE_FILE = '/data/api_keys.json'
  SC_AUTH_DEV = '1'
  HOST = '0.0.0.0'

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'sc_data'
  destination = '/data'
