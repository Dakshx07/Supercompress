<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="Compiler mode token savings by workload, all with 100% critical content kept">
<rect width="920" height="320" rx="16" fill="#fafafa" stroke="#e5e7eb"/>
<text x="60" y="32" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#0f172a">Compiler mode: tokens removed by workload</text>
<text x="60" y="52" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Every bar kept 100% of answer-critical content. Savings vary with how much noise is in the dump.</text>
<line x1="60" y1="264" x2="896" y2="264" stroke="#e5e7eb"/>
<text x="52" y="268" text-anchor="end" font-size="10" fill="#64748b">0%</text>
<line x1="60" y1="210" x2="896" y2="210" stroke="#e5e7eb"/>
<text x="52" y="214" text-anchor="end" font-size="10" fill="#64748b">25%</text>
<line x1="60" y1="156" x2="896" y2="156" stroke="#e5e7eb"/>
<text x="52" y="160" text-anchor="end" font-size="10" fill="#64748b">50%</text>
<line x1="60" y1="102" x2="896" y2="102" stroke="#e5e7eb"/>
<text x="52" y="106" text-anchor="end" font-size="10" fill="#64748b">75%</text>
<line x1="60" y1="48" x2="896" y2="48" stroke="#e5e7eb"/>
<text x="52" y="52" text-anchor="end" font-size="10" fill="#64748b">100%</text>
<!-- 42.6% -->
<rect x="107" y="172" width="115" height="92" rx="6" fill="#2563eb"/>
<text x="164.5" y="292" text-anchor="middle" font-size="11" fill="#334155">Literature context</text>
<text x="164.5" y="166" text-anchor="middle" font-size="10" fill="#1e40af">42.6%</text>
<!-- 30.0% -->
<rect x="316" y="199" width="115" height="65" rx="6" fill="#2563eb"/>
<text x="373.5" y="292" text-anchor="middle" font-size="11" fill="#334155">Dense coding session</text>
<text x="373.5" y="193" text-anchor="middle" font-size="10" fill="#1e40af">30.0%</text>
<!-- 95.1% -->
<rect x="525" y="59" width="115" height="205" rx="6" fill="#2563eb"/>
<text x="582.5" y="292" text-anchor="middle" font-size="11" fill="#334155">Docs / markdown</text>
<text x="582.5" y="53" text-anchor="middle" font-size="10" fill="#1e40af">95.1%</text>
<!-- 81.2% -->
<rect x="734" y="89" width="115" height="175" rx="6" fill="#2563eb"/>
<text x="791.5" y="292" text-anchor="middle" font-size="11" fill="#334155">Agent incident log</text>
<text x="791.5" y="83" text-anchor="middle" font-size="10" fill="#1e40af">81.2%</text>
</svg>
