services:
  - type: web
    name: supercompress-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SC_KEY_STORE
        value: file
      - key: SC_KEY_STORE_FILE
        value: /data/api_keys.json
      - key: SC_AUTH_DEV
        value: "0"
    disk:
      name: supercompress-data
      mountPath: /data
      sizeGB: 1
