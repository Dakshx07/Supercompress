name: Production smoke
# Manual only — was cron */15 and burned Actions minutes.
# Prod path does not need GH Actions: Vercel deploys from Git;
# `npm run deploy:prod` and `npm run prod:smoke` run locally.
# Re-enable only after minutes reset; prefer schedule ≤ daily if ever restored.
on:
  workflow_dispatch:

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Production HTTP smoke
        env:
          SUPERCOMPRESS_API_KEY: ${{ secrets.SUPERCOMPRESS_API_KEY }}
        run: bash scripts/prod-smoke.sh
