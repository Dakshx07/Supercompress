name: Control plane — PR review gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Collect check summary
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          # Best-effort check runs on head sha
          RAW=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs" --jq '{
            failed: ([.check_runs[] | select(.conclusion=="failure" or .conclusion=="timed_out")] | map(.name) | join(", ")),
            pending: ([.check_runs[] | select(.status!="completed")] | map(.name) | join(", "))
          }' 2>/dev/null || echo '{"failed":"","pending":""}')
          echo "failed=$(echo "$RAW" | jq -r '.failed // empty')" >> "$GITHUB_OUTPUT"
          echo "pending=$(echo "$RAW" | jq -r '.pending // empty')" >> "$GITHUB_OUTPUT"

      - name: Ask control plane (Reviewer / CoS Tech / Ultron)
        id: bridge
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_PUBLIC_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_GITHUB_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BRIDGE_URL:-}" ] || [ -z "${BRIDGE_SECRET:-}" ]; then
            echo "BRIDGE secrets missing — posting local fallback review"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --argjson number ${{ github.event.pull_request.number }} \
            --arg title ${{ toJSON(github.event.pull_request.title) }} \
            --arg body ${{ toJSON(github.event.pull_request.body || '') }} \
            --arg url "${{ github.event.pull_request.html_url }}" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg base "${{ github.event.pull_request.base.ref }}" \
            --arg head "${{ github.event.pull_request.head.ref }}" \
            --argjson draft ${{ github.event.pull_request.draft }} \
            --arg action "${{ github.event.action }}" \
            --arg failed "${{ steps.checks.outputs.failed }}" \
            --arg pending "${{ steps.checks.outputs.pending }}" \
            '{
              repo:$repo, number:$number, title:$title, body:$body, url:$url,
              author:$author, base:$base, head:$head, draft:$draft, action:$action,
              checks:{failed:$failed, pending:$pending}
            }')
          RESP=$(curl -sS -X POST "${BRIDGE_URL%/}/api/github/pull" \
            -H "Content-Type: application/json" \
            -H "x-bridge-github-secret: ${BRIDGE_SECRET}" \
            --data-binary "$BODY")
          echo "$RESP" | tee /tmp/bridge-pr.json
          COMMENT=$(echo "$RESP" | jq -r '.commentMarkdown // empty')
          EVENT=$(echo "$RESP" | jq -r '.githubReviewEvent // "COMMENT"')
          {
            echo "comment<<EOF"
            echo "$COMMENT"
            echo "EOF"
            echo "event=$EVENT"
          } >> "$GITHUB_OUTPUT"

      - name: Post merge-readiness review comment
        if: steps.bridge.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMENT="${{ steps.bridge.outputs.comment }}"
          EVENT="${{ steps.bridge.outputs.event || 'COMMENT' }}"
          if [ -z "$COMMENT" ]; then
            COMMENT="### ◈ Control Plane review
          Automated gate reached Ultron org (Reviewer → CoS Tech → Ultron PR queue).
          Re-check locally if comment body was empty."
            EVENT=COMMENT
          fi
          # Prefer a review; fall back to issue comment
          gh api \
            --method POST \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            -f body="$COMMENT" \
            -f event="$EVENT" \
          || gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
