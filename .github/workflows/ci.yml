name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package import smoke
        run: |
          pip install -e . -q || pip install -r requirements.txt -q
          python -c "import supercompress; print('ok', getattr(supercompress, '__version__', 'dev'))"
