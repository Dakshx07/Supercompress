name: Control plane — issue intake

on:
  issues:
    types: [opened, reopened]

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Route issue to Ultron control plane
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_PUBLIC_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_GITHUB_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BRIDGE_URL:-}" ] || [ -z "${BRIDGE_SECRET:-}" ]; then
            echo "BRIDGE_PUBLIC_URL / BRIDGE_GITHUB_SECRET not set — skip"
            exit 0
          fi
          BODY=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --argjson number ${{ github.event.issue.number }} \
            --arg title ${{ toJSON(github.event.issue.title) }} \
            --arg body ${{ toJSON(github.event.issue.body || '') }} \
            --arg url "${{ github.event.issue.html_url }}" \
            --arg author "${{ github.event.issue.user.login }}" \
            --argjson labels ${{ toJSON(github.event.issue.labels.*.name) }} \
            '{repo:$repo,number:$number,title:$title,body:$body,url:$url,author:$author,labels:$labels}')
          curl -sS -X POST "${BRIDGE_URL%/}/api/github/issue" \
            -H "Content-Type: application/json" \
            -H "x-bridge-github-secret: ${BRIDGE_SECRET}" \
            --data-binary "$BODY" | tee /tmp/bridge-issue.json
          jq -e '.ok == true' /tmp/bridge-issue.json
